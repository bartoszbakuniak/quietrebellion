      - name: Determine release version
        shell: bash
        run: |
          set -euo pipefail

          VERSION_CODE="$(
            sed -nE 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' \
              android/app/build.gradle.kts |
            head -n 1
          )"

          if [ -z "$VERSION_CODE" ]; then
            echo "::error::Could not determine versionCode from android/app/build.gradle.kts"
            exit 1
          fi

          if [[ "$GITHUB_REF" == refs/tags/android-v* ]]; then
            VERSION="${GITHUB_REF_NAME#android-v}"
          else
            VERSION="0.${VERSION_CODE}"
          fi

          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          echo "Version code: $VERSION_CODE"
          echo "Version: $VERSION"

      - name: Rename APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(
            find android/app/build/outputs/apk/release \
              -type f \
              -name "*.apk" \
              -print \
              -quit
          )"

          if [ -z "$APK" ]; then
            echo "::error::No release APK found"
            exit 1
          fi

          mv "$APK" "quietrebellion-${VERSION}.apk"

      - name: Assemble release notes from fastlane changelogs
        shell: bash
        run: |
          set -euo pipefail

          CHANGELOG_DIR="fastlane/metadata/android/en-US/changelogs"
          HEADER_FILE=".github/release-notes-header.md"
          FOOTER_FILE=".github/release-notes-footer.md"
          OUTPUT_FILE="release-notes-generated.md"
          CURRENT_CHANGELOG="${CHANGELOG_DIR}/${VERSION_CODE}.txt"

          if [ ! -f "$HEADER_FILE" ]; then
            echo "::error::Release notes header not found: $HEADER_FILE"
            exit 1
          fi

          if [ ! -f "$FOOTER_FILE" ]; then
            echo "::error::Release notes footer not found: $FOOTER_FILE"
            exit 1
          fi

          if [ ! -f "$CURRENT_CHANGELOG" ]; then
            echo "::error::No fastlane changelog found at ${CURRENT_CHANGELOG}"
            echo "::error::Expected a changelog for versionCode ${VERSION_CODE}"
            echo "Available changelogs:"
            find "$CHANGELOG_DIR" -maxdepth 1 -type f -name "*.txt" -print || true
            exit 1
          fi

          {
            cat "$HEADER_FILE"
            echo

            for ((vc = VERSION_CODE; vc >= 1; vc--)); do
              CHANGELOG_FILE="${CHANGELOG_DIR}/${vc}.txt"

              if [ -f "$CHANGELOG_FILE" ]; then
                if [ "$vc" -eq "$VERSION_CODE" ]; then
                  CHANGELOG_VERSION="$VERSION"
                else
                  CHANGELOG_VERSION="0.${vc}"
                fi

                echo "### What's new in ${CHANGELOG_VERSION}"
                echo
                cat "$CHANGELOG_FILE"
                echo
              fi
            done

            cat "$FOOTER_FILE"
          } > "$OUTPUT_FILE"

          echo "Generated release notes:"
          cat "$OUTPUT_FILE"
