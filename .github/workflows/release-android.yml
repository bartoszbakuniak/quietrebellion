name: Build & Release (Android)

on:
  workflow_dispatch:
  push:
    tags:
      - "android-v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build components
        run: |
          sdkmanager \
            "platforms;android-35" \
            "build-tools;34.0.0" \
            "ndk;26.1.10909125" \
            "cmake;3.22.1"

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Decode signing key
        run: |
          echo "${{ secrets.SIGNING_KEY_BASE64 }}" | base64 --decode > android/app/release.jks

      - name: Build Release APK
        working-directory: android
        env:
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Show release APKs
        run: |
          ls -la android/app/build/outputs/apk/release
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --print-certs android/app/build/outputs/apk/release/*.apk || true

      - name: Determine release version
        shell: bash
        run: |
          set -euo pipefail

          VERSION_CODE="$(
            sed -nE 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' \
              android/app/build.gradle.kts |
            head -n1
          )"

          if [ -z "$VERSION_CODE" ]; then
            echo "::error::Unable to determine versionCode from android/app/build.gradle.kts"
            exit 1
          fi

          if [[ "$GITHUB_REF" == refs/tags/android-v* ]]; then
            VERSION="${GITHUB_REF_NAME#android-v}"
          else
            VERSION="0.${VERSION_CODE}"
          fi

          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          echo "VersionCode: $VERSION_CODE"
          echo "Version: $VERSION"

      - name: Rename APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(
            find android/app/build/outputs/apk/release \
              -type f \
              -name "*.apk" \
              -print \
              -quit
          )"

          if [ -z "$APK" ]; then
            echo "::error::No release APK found."
            exit 1
          fi

          mv "$APK" "quietrebellion-${VERSION}.apk"

      - name: Assemble release notes
        shell: bash
        run: |
          set -euo pipefail

          HEADER=".github/release-notes-header.md"
          FOOTER=".github/release-notes-footer.md"
          CHANGELOG_DIR="fastlane/metadata/android/en-US/changelogs"
          OUTPUT="release-notes-generated.md"

          CURRENT_CHANGELOG="${CHANGELOG_DIR}/${VERSION_CODE}.txt"

          if [ ! -f "$HEADER" ]; then
            echo "::error::Missing $HEADER"
            exit 1
          fi

          if [ ! -f "$FOOTER" ]; then
            echo "::error::Missing $FOOTER"
            exit 1
          fi

          if [ ! -f "$CURRENT_CHANGELOG" ]; then
            echo "::error::Missing changelog: $CURRENT_CHANGELOG"
            echo
            echo "Available changelogs:"
            find "$CHANGELOG_DIR" -maxdepth 1 -name "*.txt" | sort || true
            exit 1
          fi

          {
            cat "$HEADER"
            echo

            for ((vc=VERSION_CODE; vc>=1; vc--)); do
              FILE="${CHANGELOG_DIR}/${vc}.txt"

              if [ -f "$FILE" ]; then
                if [ "$vc" -eq "$VERSION_CODE" ]; then
                  LABEL="$VERSION"
                else
                  LABEL="0.${vc}"
                fi

                echo "### What's new in ${LABEL}"
                echo
                cat "$FILE"
                echo
              fi
            done

            cat "$FOOTER"
          } > "$OUTPUT"

          echo "Generated release notes:"
          echo "----------------------------------------"
          cat "$OUTPUT"
          echo "----------------------------------------"

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/android-v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Android v${{ env.VERSION }}
          body_path: release-notes-generated.md
          files: quietrebellion-${{ env.VERSION }}.apk

      - name: Print F-Droid metadata values
        run: |
          echo "Commit : $GITHUB_SHA"
          echo "Tag    : $GITHUB_REF_NAME"
          echo "Version: $VERSION"
          echo "APK    : https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/quietrebellion-${VERSION}.apk"
