Jak to szybko uruchomić u siebie na komputerze (Zamiast kompilatorów online):
Jeśli chcesz go zbudować dokładnie tak, jak na Twoim screenie, zrobisz to na swoim komputerze w 3 minuty przy użyciu darmowego narzędzia od Microsoftu. Nie potrzebujesz stron internetowych: 

    Zainstaluj menedżer pakietów: Otwórz menu Start, wpisz powershell (uruchom jako administrator) i wklej tę komendę, aby przygotować środowisko vcpkg:
    powershell

    Set-ExecutionPolicy Bypass -Scope Process -Force; [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.SecurityProtocolType]::Tls12; iex ((New-Object System.Net.WebClient).DownloadString('https://chocolatey.org')); choco install cmake vcpkg -y

    Używaj kodu z rozwagą.
    Pobierz kod: Pobierz plik ZIP z kodu źródłowego Bose-QuietComfort-Ultra-gui na GitHubie, rozpakuj go na Pulpit, wejdź do folderu i w pasku adresu u góry wpisz cmd.
    Wklej komendę ze swojego screena: W czarnym oknie wklej dokładnie to polecenie: 
    bash

    cmake -S . -Bbuild -DCMAKE_TOOLCHAIN_FILE="C:\vcpkg\scripts\buildsystems\vcpkg.cmake"
    cmake --build build --config Release

    Używaj kodu z rozwagą.

Po ułamku minuty w folderze build/Release pojawi się Twój gotowy, bezpieczny plik Bose-QuietComfort-Ultra-gui.exe. Program ma ładne okienka, bez problemu wykryje Twoje QC Ultra 2 przez Bluetooth i będzie w 100% bezpieczny – nie zaktualizuje firmware w słuchawkach. 
