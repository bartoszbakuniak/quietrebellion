Oto instrukcja krok po kroku, jak to wyklikać w przeglądarce:
Krok 1: Zrób własną kopię projektu (Fork)

    Zaloguj się na swoje konto na stronie GitHub. Jeśli go nie masz, załóż je w minutę.
    Wejdź na stronę projektu: MadEyez/quietrebellion na GitHubie.
    W prawym górnym rogu ekranu kliknij przycisk Fork (rozpoczniesz kopiowanie projektu do swojego profilu).
    Kliknij zielony przycisk Create fork. Teraz masz własną kopię tego kodu, w której możesz uruchomić kompilator chmurowy.

Krok 2: Włącz automatyczny kompilator chmurowy

    W Twojej nowo skopiowanej wersji projektu, na górnym pasku nawigacji kliknij w zakładkę Actions (Akcje).
    Jeśli zobaczysz duży zielony przycisk z napisem „I understand my workflows, go ahead and enable them”, kliknij go. To daje serwerom GitHuba pozwolenie na budowanie kodu.

Krok 3: Stwórz plik automatycznej kompilacji (Robisz to raz)

    Wróć do głównej zakładki Code w swoim projekcie.
    Kliknij przycisk Add file -> Create new file.
    W polu nazwy pliku (u góry) wpisz dokładnie taką ścieżkę: .github/workflows/build.yml (ukośniki automatycznie utworzą odpowiednie foldery).
    Do dużego pola tekstowego poniżej wklej ten gotowy skrypt, który każe serwerowi Microsoftu zbudować plik .exe dla Windowsa: 
    Anton Dev Tips

yaml

name: Buduj plik EXE online
on: [workflow_dispatch, push]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Uruchom .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    - name: Kompilacja kodu dla Windows
      run: |
        cd csharp
        dotnet publish -c Release -r win-x64 --self-contained -o ./gotowy_program
    - name: Wrzuć gotowy plik do pobrania
      uses: actions/upload-artifact@v4
      with:
        name: QuietRebellion-Najnowsza-Wersja
        path: csharp/gotowy_program/

Używaj kodu z rozwagą.

    Kliknij zielony przycisk Commit changes... (Zapisz zmiany) w prawym górnym rogu, a potem ponownie Commit changes w okienku, które wyskoczy.

Krok 4: Pobierz swój gotowy plik .exe!

    Przejdź ponownie do zakładki Actions na samej górze.
    Po lewej stronie zobaczysz napis "Buduj plik EXE online" – kliknij w niego.
    Po prawej stronie pojawi się szary przycisk Run workflow. Kliknij go, a następnie zatwierdź zielonym przyciskiem Run workflow.
    Po odświeżeniu strony zobaczysz uruchomione zadanie (będzie miało pomarańczową ikonkę ładowania). Serwer w chmurze właśnie pobiera kod i buduje go dla Ciebie. Trwa to około 1-2 minut.
    Gdy ikona zmieni kolor na zielony (sukces), kliknij w nazwę tego uruchomienia (np. „Buduj plik EXE online”).
    Zjedź na sam dół strony do sekcji Artifacts (Pliki wynikowe). Zobaczysz tam paczkę o nazwie QuietRebellion-Najnowsza-Wersja. 

Kliknij w nią, a pobierze się plik ZIP zawierający najświeższy, skompilowany w chmurze plik QuietRebellion.exe gotowy do odpalenia na Twoim Windowsie!
Daj znać, na którym etapie klikania jesteś i czy udało Ci się pobrać wygenerowany plik ZIP z chmury GitHuba! Jeśli napotkasz jakiś problem z uprawnieniami, chętnie podpowiem, co zmienić.
