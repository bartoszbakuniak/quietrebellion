Dlaczego to dokładnie to, czego szukasz:

    Silnik od Aarona: Autor programu zachował 100% logiki, bazy urządzeń i sposobu komunikacji bezprzewodowej, które Aaron opracował dla QC Ultra 2. Masz gwarancję, że sprzęt dogada się z komputerem idealnie. 
    Nowoczesne, dedykowane okna (GUI): W przeciwieństwie do surowej wersji konsolowej czy schowanej ikonki w trayu, ten projekt posiada ładne, dedykowane panele, gdzie na dużym ekranie sterujesz trybami ANC, profilami dźwiękowymi oraz widzisz dokładny stan baterii.
    Blokada aktualizacji w standardzie: Dokładnie tak jak u Aarona – aplikacja nie łączy się z serwerami Bose, więc nie ma fizycznej opcji, aby w tle popsuła Ci dźwięk nowym firmware.

