          dotnet-version: "7.0.x"

      - name: Publish single-file exe
        run: >
          dotnet publish csharp/BoseCtl/BoseCtl.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -o out

      - name: Rename exe
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#windows-v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          mv out/quiet-rebellion.exe "quietrebellion-${VERSION}-win-x64.exe"

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
