tak
Oto instrukcja, jak samodzielnie skompilować najnowszą wersję programu Quiet Rebellion na swoim komputerze. Ponieważ projekt jest napisany w języku C# (.NET), proces ten jest prosty i zajmie Ci zaledwie kilka minut.
Krok 1: Pobierz darmowe narzędzia od Microsoftu
Aby Twój system Windows potrafił zamienić kod w plik startowy .exe, potrzebujesz kompilatora.

    Wejdź na oficjalną stronę Microsoft: Pobierz .NET SDK.
    Pobierz wersję oznaczoną jako .NET SDK (rekomendowana wersja x64 dla Windows).
    Uruchom pobrany plik instalacyjny i przeklikaj instalację (tak jak przy instalowaniu zwykłego programu).

Krok 2: Pobierz najnowszy kod źródłowy z GitHuba

    Przejdź na stronę projektu: MadEyez/quietrebellion na GitHubie.
    Kliknij zielony przycisk z napisem Code (znajduje się po prawej stronie, nad listą plików).
    Z rozwijanego menu wybierz opcję Download ZIP.
    Po pobraniu archiwum, rozpakuj je w dowolnym miejscu na komputerze (np. na Pulpicie).

Krok 3: Skompiluj program (Jedna komenda)

    Otwórz folder, do którego rozpakowałeś kod (musisz widzieć w nim pliki takie jak QuietRebellion.sln lub folder QuietRebellion).
    Kliknij w wolne miejsce na pasku adresu na samej górze okna Eksploratora plików, wpisz słowo cmd i naciśnij Enter. Otworzy się czarne okno wiersza poleceń ustawione dokładnie w tym folderze.
    Wklej do czarnego okna następującą komendę i zatwierdź ją Enterem:
    bash

    dotnet publish -c Release -r win-x64 --self-contained

    Używaj kodu z rozwagą.
    Proces kompilacji się rozpocznie. Kompilator automatycznie pobierze wymagane biblioteki i zbuduje gotowy program. Trwa to zazwyczaj od kilkunastu sekund do minuty.

Gdzie znajdziesz gotowy plik?
Po poprawnym zakończeniu procesu w czarnym oknie, Twój nowiutki plik .exe będzie czekał wewnątrz nowo powstałych katalogów:
QuietRebellion \ bin \ Release \ netX.X \ win-x64 \ publish \
W folderze publish znajdziesz plik QuietRebellion.exe. Możesz go uruchomić – to najświeższa wersja zbudowana z kodu, która nadal nie ma prawa połączyć się z serwerami Bose i nie zaktualizuje Twoich słuchawek.
Gdyby na którymś etapie pojawił się błąd (np. w kroku z wpisywaniem komendy), skopiuj mi jego treść, a od razu powiem Ci, jak go rozwiązać!
