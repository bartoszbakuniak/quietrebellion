che ja przerobic na windowsa
„Przerobienie” tej konkretnej aplikacji na Windowsa jest niestety bardzo trudne (a dla przeciętnego użytkownika wręcz niemożliwe), ponieważ program bosectl opiera się na specyficznych mechanizmach Bluetooth, które są unikalne dla systemu Linux (tzw. stos BlueZ i system D-Bus). 
GitHub
Nie wystarczy go po prostu "przeklikać" ani przekonwertować prostym programem. Aby to działało na Windowsie, programista musiałby napisać od nowa cały moduł odpowiedzialny za komunikację bezprzewodową z urządzeniami, przepisując go na systemowe biblioteki Microsoftu (WinRT/Windows.Devices.Bluetooth).
Jeśli chcesz korzystać z funkcji słuchawek Bose na Windowsie, masz do wyboru trzy znacznie prostsze ścieżki:
1. Rozwiązanie "pół-oficjalne": Aplikacje z Microsoft Store
W sklepie Windows (Microsoft Store) niezależni programiści stworzyli aplikacje, które działają podobnie do bosectl, ale są od razu napisane pod Windowsa. Wyszukaj w sklepie aplikację o nazwie Bose Control lub Earbuds Control for Bose (są to programy firm trzecich, często płatne kilka złotych lub z darmowym okresem próbnym), które dodają kontrolę ANC i baterii do paska zadań Windows.
2. Oficjalne narzędzie: Bose Updater
Jeśli potrzebujesz aplikacji na Windowsa głównie po to, by aktualizować oprogramowanie słuchawek lub zmieniać ich podstawowe parametry wewnętrzne, pobierz oficjalny Bose Updater. Po zainstalowaniu programu i podłączeniu słuchawek kablem USB do komputera, zyskujesz dostęp do oficjalnego panelu zarządzania w przeglądarce. 
Bose +1
3. Sterowanie przez telefon (Najwygodniejsze)
Słuchawki Bose zapamiętują swoje ustawienia (np. tryb redukcji szumów czy poziom ANC). Najprostszy trik polega na tym, by:

    Połączyć słuchawki jednocześnie z telefonem i komputerem z Windows (Bose obsługuje funkcję Multipoint – dwa źródła dźwięku na raz).
    Słuchać muzyki lub grać na komputerze.
    Gdy chcesz zmienić tryb ANC lub sprawdzić baterię, po prostu otwierasz oficjalną aplikację Bose Music na telefonie – zmiana trybu w telefonie natychmiast zadziała na słuchawkach, bez przerywania dźwięku z Windowsa.

Jeśli bardzo zależy Ci na uruchomieniu dokładnie kodu od Aarona, daj znać:

    Czy masz doświadczenie w programowaniu (np. w C++ lub Pythonie)?
    Czy chcesz spróbować odpalić to przez WSL2 (Windows Subsystem for Linux) na swoim komputerze?

