napisałem do aros w prawe bose ctla ale nie odpisał 25 dni
To zupełnie zrozumiałe, że czujesz irytację i niepokój – 25 dni bez jakiejkolwiek odpowiedzi w sprawie reklamacji czy zwrotu to zdecydowanie za długo i przekracza standardy obsługi klienta.
Prawdopodobnie pisząc o „aros”, masz na myśli sklep internetowy (np. popularną księgarnię/sklep Aros.pl), a „bose ctla” to zniekształcona nazwa słuchawek (np. Bose QuietComfort Ultra lub Earbuds Ultra). Jeśli sklep ignoruje Twoje wiadomości e-mail, czas zmienić strategię, aby wymusić kontakt.
Oto co możesz zrobić krok po kroku, aby odzyskać pieniądze lub rozwiązać sprawę:
1. Zmień kanał kontaktu (Zadzwoń)
E-maile łatwo zignorować lub mogły wpaść do spamu. Zadzwoń bezpośrednio na infolinię sklepu, przygotowując wcześniej numer zamówienia. Rozmowa z konsultantem na żywo zazwyczaj przyspiesza sprawę od ręki.
2. Wykorzystaj Chargeback (Jeśli płaciłeś kartą)
Jeśli płatność za sprzęt była dokonywana kartą płatniczą (debetową lub kredytową Visa/Mastercard), skontaktuj się ze swoim bankiem i zgłoś procedurę Chargeback (obciążenie zwrotne).

    Jako powód podaj brak kontaktu ze sprzedawcą oraz brak realizacji usługi/towaru (lub brak zwrotu środków po odesłaniu towaru).
    Bank uruchomi procedurę wyjaśniającą i jeśli sklep nie udowodni swojej racji, odzyskasz pieniądze bezpośrednio na konto.

3. Zgłoś sprawę do Poczty / Kuriera (Jeśli paczka nie doszła)
Jeśli status przesyłki utknął, a sklep milczy, wina może leżeć po stronie firmy przewozowej. Czasami to sklep czeka na rozwiązanie reklamacji przez kuriera, zapominając poinformować o tym klienta.
4. Prawa konsumenta są po Twojej stronie
Pamiętaj, że w przypadku reklamacji z tytułu rękojmi, jeśli przedsiębiorca nie odpowie na Twoje żądanie w terminie 14 dni kalendarzowych, uważa się, że uznał to żądanie za uzasadnione. Sklep nie może po tym czasie legalnie odrzucić Twojej reklamacji.
Jeśli chcesz, abym pomógł Ci mocniej, napisz:

    Czego dokładnie dotyczyła Twoja wiadomość? (zwrotu towaru w 14 dni, reklamacji zepsutego sprzętu czy braku dostawy?)
    W jaki sposób dokonałeś płatności?
    Czy masz potwierdzenie nadania paczki (jeśli coś odsyłałeś)?

Mając te informacje, pomogę Ci przygotować oficjalne i ostateczne wezwanie do zapłaty lub załatwienia sprawy.
Wyłącznie do celów informacyjnych. Aby uzyskać poradę medyczną lub diagnozę, skonsultuj się ze specjalistą. Odpowiedzi wygenerowane przez AI mogą zawierać błędy. Więcej informacji
