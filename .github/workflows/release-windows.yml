Aby skompilować absolutnie najnowszą wersję kodu aplikacji Quiet Rebellion (autorstwa MadEyez) bezpośrednio na system Windows, musisz zbudować projekt znajdujący się w katalogu csharp/ oficjalnego repozytorium MadEyez/quietrebellion na GitHubie.
Ponieważ pod maską jest to aplikacja napisana w środowisku .NET (C#), jej kompilacja na Windowsie jest bardzo prosta i nie wymaga skomplikowanych narzędzi z Twojego zrzutu ekranu (tamte komendy dotyczyły języka C++). Całość zamkniesz w 3 prostych krokach:
Krok 1: Przygotuj darmowy kompilator od Microsoftu
Twój komputer musi zyskać narzędzie, które przetłumaczy kod na plik startowy.

    Wejdź na oficjalną stronę Microsoft i pobierz pakiet programistyczny: Pobierz najnowszy .NET SDK dla Windows.
    Wybierz wersję .NET SDK (rekomendowany instalator x64).
    Zainstaluj go, przeklikując standardowy proces instalacji systemu Windows.

Krok 2: Pobierz najnowsze pliki źródłowe projektu

    Przejdź bezpośrednio na stronę główną repozytorium: MadEyez/quietrebellion na GitHubie.
    Kliknij zielony przycisk Code (w prawym górnym rogu listy plików) i wybierz Download ZIP.
    Rozpakuj pobrane archiwum w wygodnym dla siebie miejscu, na przykład na Pulpicie.

Krok 3: Wywołaj automatyczną kompilację

    Otwórz rozpakowany folder, przejdź głębiej do katalogu o nazwie csharp (to tam znajduje się kod dedykowany dla Windowsa).
    Kliknij w puste miejsce na pasku adresu u samej góry Eksploratora plików (tam, gdzie wyświetla się ścieżka folderu), wpisz słowo cmd i naciśnij Enter. Otworzy się czarne okno Wiersza poleceń.
    Wklej do czarnego okna poniższą komendę i zatwierdź ją przyciskiem Enter:
    bash

    dotnet publish -c Release -r win-x64 --self-contained

    Używaj kodu z rozwagą.

Gdzie pojawi się Twój nowy program?
Kompilator pobierze wymagane biblioteki i zbuduje najświeższą wersję kodu. Gdy proces dobiegnie końca, Twój gotowy plik .exe znajdziesz w podfolderze:
...\quietrebellion\csharp\bin\Release\netX.X\win-x64\publish\
Wewnątrz katalogu publish będzie znajdował się plik QuietRebellion.exe (oraz towarzyszące mu biblioteki). Możesz go uruchomić – to najnowsza możliwa wersja kodu zintegrowana z interfejsem okienkowym Windowsa, która bez problemu obsłuży Twoje słuchawki Bose QC Ultra 2 i nigdy nie połączy się z serwerami firmy Bose, blokując automatyczne aktualizacje firmware.
