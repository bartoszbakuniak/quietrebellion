Wybacz moje przeoczenie – pomyliłem nazwy programów!
Aplikacja, o której pisałem wcześniej, nie nazywa się MagicBose, a bosectl-qt (wersja okienkowa od Aarona) oraz alternatywny, świetny projekt na Windowsa i Linuxa: bose-tray.
Oba te programy działają dokładnie tak, jak opisaliśmy: obsługują słuchawki lokalnie przez Bluetooth, dają Ci kontrolę z paska zadań i nie mają możliwości pobrania aktualizacji (firmware), bo nie łączą się z internetem.
Oto bezpośrednie i pewne linki do pobrania oficjalnych, gotowych wersji:
1. Bose-Tray (Najwygodniejszy dla Windowsa)
To darmowy, mały program stworzony specjalnie po to, by dodać ikonkę słuchawek obok zegarka w Windowsie. Pozwala kontrolować ANC i baterię.

    Gdzie pobrać: Wejdź na GitHub - bose-tray.
