Aby uruchomić akcje w tym repozytorium, wykonaj następujące kroki bezpośrednio na ekranie widocznym na zdjęciu:

    Kliknij zielony przycisk z napisem „I understand my workflows, go ahead and enable them”.
    Uruchom przepływ pracy: Po kliknięciu zostaniesz przeniesiony do zakładki Actions. Jeśli dany skrypt posiada wyzwalacz ręczny, wybierz go z listy po lewej stronie, kliknij rozwijane menu Run workflow i zatwierdź zielonym przyciskiem.

Gdy to zrobisz, GitHub Actions zaczną działać przy kolejnych zmianach w kodzie (np. po wykonaniu git push) lub po ich ręcznym wywołaniu.
Jeśli po kliknięciu przycisku pojawią się błędy lub procesy zakończą się niepowodzeniem (oznaczonym czerwonym iksem), napisz, jaki komunikat błędu się wyświetla lub co dokładnie ten projekt ma robić, a pomogę Ci go poprawnie skonfigurować.
